name: Reveal Secret

on: 
  workflow_dispatch: # Allows you to trigger this manually

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Base64 Encode Secret
        run: |
          # This converts the secret to a safe base64 string so GitHub doesn't mask it with ***
          echo "Encoded secret is: $(echo -n "${{ secrets.SRIKANTH }}" | base64)"
